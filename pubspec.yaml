name: shorts_studio
description: Otonom Türkçe YouTube Shorts / Reels üretici (tamamen cihaz üstünde, ücretsiz).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # FFmpeg: orijinal ffmpeg_kit_flutter_full_gpl proje kapandığı için artık derlenmiyor.
  # Bakımı süren fork (Full-GPL: libx264, zoompan, ass/libass, sidechaincompress dahil):
  ffmpeg_kit_flutter_new: ^4.5.3

  path_provider: ^2.1.5      # geçici çalışma klasörü
  http: ^1.2.2               # Pollinations görsel/metin indirme
  crypto: ^3.0.6             # Edge-TTS Sec-MS-GEC belirteci (SHA-256)
  flutter_tts: ^4.2.0        # yedek: Android yerel Türkçe TTS (dosyaya sentez)
  gal: ^2.3.1                # Galeriye kaydet (Android 10+ izin istemez; permission_handler gerekmez)
  video_player: ^2.9.2       # uygulama içi oynatıcı
  share_plus: ^10.1.4        # Paylaş
  wakelock_plus: ^1.2.10     # render sırasında ekran kapanmasın

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
